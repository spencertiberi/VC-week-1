# Publishes the site to GitHub Pages when the production branch changes.
# Only the files the site needs are published (not docs/ or tools/).
# Setup: Settings → Pages → Source: "GitHub Actions". Then in Settings → Environments →
# github-pages, allow the "production" branch to deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate content and data
        run: node tools/validate.mjs
      - name: Simulate playthroughs
        run: node tools/simulate.mjs --runs 3000
      - name: Assemble site
        run: |
          mkdir _site
          cp -R index.html styles.css .nojekyll engine profile content _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
