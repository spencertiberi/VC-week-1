# Checks content on every push and pull request. No dependencies to install.
name: Check content

on:
  push:
    branches-ignore: [production]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate content and data
        run: node tools/validate.mjs
      - name: Simulate playthroughs
        run: node tools/simulate.mjs --runs 3000
